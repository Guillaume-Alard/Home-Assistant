# ── Musique : préréglages & lecteur par défaut (Phase 9) ─────────────────
# Luna pilote tes lecteurs media_player de Nova. Ce fichier donne un lecteur par
# défaut, une pièce par défaut, et des raccourcis nommés (« mets du jazz »).
# Voir docs/MUSIQUE.md.

# Lecteur visé quand tu ne précises rien (« mets de la musique ») et qu'aucun
# lecteur ne joue déjà — ton lecteur Spotify.
lecteur_defaut: media_player.spotify_guillaume_alard

# Pièce visée en priorité si tu dis « … dans le salon » (utilise l'entité de la
# pièce si elle existe ; sinon on retombe sur lecteur_defaut).
piece_defaut: Salon

# Préréglages : un nom → un contenu Spotify à jouer.
#   content_id   : l'URI Spotify (voir « Comment obtenir une URI » plus bas)
#   content_type : playlist | album | track | artist
#
# ⚠️  Remplace les URI d'exemple par CELLES DE TES PROPRES playlists : depuis la
#     mise à jour de l'API Spotify (fin 2024), les playlists “éditoriales” de
#     Spotify (celles dont l'ID commence par 37i9…) ne sont plus jouables par
#     l'API. Tes playlists à toi, en revanche, marchent parfaitement.
#
# Comment obtenir une URI : dans Spotify, clic droit sur une playlist/album →
#   Partager → « Copier le lien Spotify URI » (format spotify:playlist:xxxxxxxx).
presets:
  # jazz:
  #   content_id: "spotify:playlist:TON_ID_ICI"
  #   content_type: "playlist"
  # detente:
  #   content_id: "spotify:playlist:TON_ID_ICI"
  #   content_type: "playlist"
  # boulot:
  #   content_id: "spotify:playlist:TON_ID_ICI"
  #   content_type: "playlist"
