# ── Alertes proactives de Sentinel ───────────────────────────────────────
# Sentinel écoute les changements d'état de Nova ; quand une règle correspond,
# il prend la parole sur les appareils connectés et/ou notifie le téléphone.
#
# Chaque règle (liste) :
#   id        : identifiant court (journal, anti-rebond)
#   nom       : libellé lisible
#   entites   : liste d'entity_id exacts        (au moins entites OU motif)
#   motif     : motif glob, ex. "binary_sensor.*fumee*"
#   vers      : état(s) qui déclenchent (transition entrante uniquement)
#   depuis    : état(s) d'origine exigés (optionnel)
#   condition : { entite: ..., etats: [...] }   (optionnel, ex. alarme armée)
#   gravite   : info | attention | critique
#               (critique interrompt même Sentinel s'il est en train de parler)
#   message   : gabarit — variables : {friendly_name} {entity_id} {state}
#   parler    : true/false — annonce vocale sur les appareils connectés (défaut true)
#   notifier  : { service: notify.mobile_app_xxx, titre: "..." }   (optionnel)
#   silence   : anti-rebond en secondes par entité (défaut 300)
#
# La notification passe par le moteur d'actions (chemin « système », journalisé).
# Après modification : docker compose restart sentinel-core

# Règle de test : crée un « bouton » dans Nova (Paramètres → Appareils et
# services → Entrées → Bouton à bascule, nommé « Test Sentinel ») puis
# bascule-le : Sentinel doit l'annoncer de vive voix.
- id: test
  nom: "Test d'alerte"
  entites: [input_boolean.test_sentinel]
  vers: ["on"]
  gravite: info
  message: "Ceci est un test : {friendly_name} vient d'être activé."
  parler: true
  silence: 10

