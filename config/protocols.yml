# ── Protocoles de Sentinel ───────────────────────────────────────────────
# Un protocole = une séquence d'actions Home Assistant déclenchable à la voix
# (« Sentinel, protocole forteresse »), à l'écrit, ou par le LLM.
#
# Champs :
#   nom      : nom affiché et prononcé (défaut : la clé)
#   risque   : faible | moyen | sensible
#              - faible/moyen : exécution immédiate sur ordre direct
#              - sensible     : double confirmation vocale exigée
#   annonce  : phrase dite par Sentinel à l'exécution
#   phrases  : déclencheurs vocaux supplémentaires (en plus de
#              « protocole <nom> » et « mode <nom> », implicites)
#   actions  : liste d'appels de services HA, exécutés dans l'ordre
#     - service : "domaine.service"                (obligatoire)
#       data    : { … }                            (service_data, optionnel)
#       target  : { entity_id: [...] | area_id: [...] }   (cibles HA, optionnel)
#
# Après modification : docker compose restart sentinel-core
# Les étapes en échec n'arrêtent pas le protocole — elles sont signalées.

# Protocole de test : ne touche à rien, crée juste une notification dans
# l'interface de Nova. Idéal pour valider la chaîne complète dès le premier jour.
test:
  nom: "Test"
  risque: faible
  annonce: "Protocole de test exécuté. La chaîne fonctionne."
  actions:
    - service: persistent_notification.create
      data:
        title: "Sentinel"
        message: "Protocole de test exécuté avec succès."

# Forteresse : verrouillage de la maison. Livré avec une seule étape inoffensive
# (notification) pour être utilisable immédiatement — décommente et adapte les
# étapes réelles avec TES entity_id (Outils de développement → États, dans Nova).
forteresse:
  nom: "Forteresse"
  risque: moyen
  annonce: "Protocole Forteresse activé. La maison passe en mode sécurisé."
  phrases:
    - "verrouille la maison"
    - "mode securise"
  actions:
    - service: persistent_notification.create
      data:
        title: "Sentinel — Forteresse"
        message: "Protocole Forteresse déclenché. (Adapte config/protocols.yml avec tes entités réelles.)"
