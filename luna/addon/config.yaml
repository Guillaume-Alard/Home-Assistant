# Manifeste de l'add-on Luna.
#
# `homeassistant_api: true` donne accès à ws://supervisor/core/websocket avec le
# SUPERVISOR_TOKEN : aucun jeton longue durée à créer ni à faire tourner (H6).
#
# Aucun port n'est publié sur l'hôte : le relais n'est joignable que depuis le
# réseau des add-ons, par l'intégration (H8). C'est volontaire — le relais
# n'authentifie que par secret partagé, il n'a rien à faire sur le LAN.
name: Luna
version: "0.1.0"
slug: luna
description: >-
  Le cerveau de Luna — orchestrateur, API Claude, contrôle de Home Assistant.
  Phases 1 à 5 : chat, voix, identité, habitudes, veille et gardienne.
url: https://github.com/Alardware/luna
arch:
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
ingress: false
host_network: false
# Le modèle d'empreinte de locuteur se dépose ici (option `modele_voix`).
map:
  - share:ro

options:
  anthropic_api_key: ""
  modele: "claude-sonnet-5"
  effort: "low"
  modele_voix: ""
  relay_secret: ""
  relay_port: 8099
  fuseau: "Europe/Paris"
  journal: "info"
  profils:
    - utilisateur_ha: "Guillaume"
      profil: "guillaume"
      presence: ""
  profil_par_defaut: "guest"

  # ── Habitudes et veille (P4) ────────────────────────────────────────
  #
  # La **détection** n'est pas ici : elle vit dans des `binary_sensor` de Home
  # Assistant, visibles dans les outils de développement (§5, F5). Ces règles
  # disent seulement quoi en faire — le message, le niveau, le moment.
  # Un jeu de capteurs de départ est fourni dans docs/P4-CAPTEURS.md.
  #
  # Le correctif éventuel se déclare en deux chaînes, `action_service` et
  # `action_cible` : le schéma d'options d'un add-on ne connaît que des types
  # simples et n'a pas de `dict`, donc une liste d'actes structurés y est
  # inexprimable. Un fichier qui en contient est rejeté en bloc, et l'add-on
  # n'apparaît pas du tout dans la boutique.
  veille: []
  observateurs:
    coucher: ""
    coucher_profil: ""
    sequences: false
  heure_entretien: "03:30"
  evenements_par_entretien: 200
  entretien_actif: true
  # Faire dire les alertes à voix haute. `enceinte` vide = rien n'est jamais
  # annoncé. `silence: true` couvre aussi les alertes `critical` : elles
  # s'affichent dans le tiroir à 3 h du matin, elles ne réveillent personne.
  annonce:
    enceinte: ""
    moteur: "tts.piper"
    niveaux:
      - warning
      - critical
    silence: true

  # ── Gardienne de l'installation (P5) ────────────────────────────────
  #
  # Elle **lit** l'état de Home Assistant : entités indisponibles,
  # intégrations en erreur, journal des automatisations, cartes de Loggia
  # qui pointent dans le vide. Elle n'écrit rien — et ça ne se règle pas
  # ici, c'est vérifié statiquement (tests/test_invariants.py).
  gardienne:
    active: true
    minutes_avant_panne: 30
    ignorer: []
    loggia: true
    loggia_url_path: ""
    journal_systeme: true

schema:
  anthropic_api_key: password
  modele: str
  effort: list(low|medium|high|xhigh|max)
  modele_voix: str?
  relay_secret: password
  relay_port: port
  fuseau: str
  journal: list(debug|info|warning|error)
  profils:
    - utilisateur_ha: str
      profil: list(guillaume|clara|liam|guest)
      presence: str?
  profil_par_defaut: list(guillaume|clara|liam|guest|unknown)
  veille:
    - entite: str
      categorie: str?
      niveau: list(info|warning|critical)?
      message: str
      raison: str?
      silence: bool?
      annonce: bool?
      fait: str?
      action_service: str?
      action_cible: str?
  observateurs:
    coucher: str?
    coucher_profil: str?
    sequences: bool?
  heure_entretien: match(^([01]\d|2[0-3]):[0-5]\d$)
  evenements_par_entretien: int(10,500)
  entretien_actif: bool
  annonce:
    enceinte: str?
    moteur: str?
    niveaux:
      - list(info|warning|critical)
    silence: bool?
  gardienne:
    active: bool
    minutes_avant_panne: int(5,1440)
    ignorer:
      - str
    loggia: bool
    loggia_url_path: str?
    journal_systeme: bool
