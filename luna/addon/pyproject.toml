[project]
name = "luna"
version = "0.1.0"
description = "Luna — le cerveau, add-on Home Assistant"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "anthropic>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "import-linter>=2", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["luna*"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC", "BLE"]
ignore = [
    "RUF001",  # les messages sont en français : apostrophes typographiques assumées
    "RUF002",
    "RUF003",
    "S101",    # assert : utilisé pour les invariants internes
    "N818",    # le code est en français : « CreditEpuiseError » ne se lit pas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
