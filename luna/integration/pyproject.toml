[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "BLE"]
ignore = [
    "RUF001",  # le code est en français : apostrophes typographiques assumées
    "RUF002",
    "RUF003",
    "N818",    # « ErreurLunaError » ne se lit pas
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
