# Sentinel — un seul fichier compose pour tout lancer.
# Les variables ${…} sont lues depuis le fichier .env (copie de .env.example).
name: sentinel

services:
  # Cerveau : API + WebSocket + UI PWA + moteur de conversation
  sentinel-core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: sentinel-core
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_DATA_DIR: /data
      WHISPER_HOST: sentinel-whisper
      WHISPER_PORT: "10300"
      PIPER_HOST: sentinel-piper
      PIPER_PORT: "10200"
      # Affichage seul dans les Paramètres (mêmes valeurs que les conteneurs Wyoming)
      WHISPER_MODEL: ${WHISPER_MODEL:-small-int8}
      PIPER_VOICE: ${PIPER_VOICE:-fr_FR-siwis-medium}
      WAKE_HOST: sentinel-openwakeword
      WAKE_PORT: 10400
      WAKEWORD_MODEL: ${WAKEWORD_MODEL:-hey_jarvis}
      # Reconnaissance de locuteur (Phase 2). Pour la DÉSACTIVER : mettre
      # SPEAKER_HOST= (vide) dans .env — Luna traite alors tout le monde comme le
      # propriétaire, exactement comme avant. Voir docs/PHASE2-LOCUTEUR.md.
      SPEAKER_HOST: ${SPEAKER_HOST-sentinel-speaker}
      SPEAKER_PORT: "10500"
      SPEAKER_THRESHOLD: ${SPEAKER_THRESHOLD:-0.75}
      # Voix de Luna : TTS_ENGINE=cloned pour la voix clonée (repli Piper auto),
      # sinon Piper. Le serveur de clonage est le service « sentinel-xtts »
      # (profil « voix », désactivé par défaut). Voir docs/VOICE.md.
      TTS_ENGINE: ${TTS_ENGINE:-piper}
      CLONED_TTS_URL: ${CLONED_TTS_URL:-http://sentinel-xtts:8000}
      CLONED_TTS_VOICE: ${CLONED_TTS_VOICE:-luna}
    ports:
      # Seul service exposé sur le LAN
      - "${SENTINEL_PORT:-8443}:8443"
    volumes:
      - ./data:/data
      # Protocoles, alertes et alias d'intents éditables sans reconstruire
      # l'image : modifier puis `docker compose restart sentinel-core`
      - ./config:/opt/sentinel/config:ro
    depends_on:
      - sentinel-whisper
      - sentinel-piper
      - sentinel-openwakeword
      - sentinel-speaker
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # STT : faster-whisper via le protocole Wyoming (image officielle de l'écosystème HA).
  # Le modèle est téléchargé au premier démarrage puis mis en cache dans le volume.
  sentinel-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: sentinel-whisper
    restart: unless-stopped
    command: --model ${WHISPER_MODEL:-small-int8} --language fr
    volumes:
      - whisper-models:/data
    # GPU NVIDIA (optionnel) : cette image est CPU. Pour un GPU, remplacer par une
    # image faster-whisper CUDA compatible Wyoming (ex. linuxserver/faster-whisper
    # avec le tag gpu), ajouter la réservation de device nvidia, et passer
    # WHISPER_MODEL=medium dans .env — même port Wyoming, rien d'autre ne change.

  # TTS : Piper via Wyoming. La voix est téléchargée au premier démarrage.
  sentinel-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: sentinel-piper
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-fr_FR-siwis-medium}
    volumes:
      - piper-voices:/data

  # Mot d'éveil (Phase 5A) : openWakeWord via Wyoming. Plusieurs mots pré-entraînés
  # sont FOURNIS avec l'image — on en précharge quelques-uns pour qu'ils apparaissent
  # « chargés » dans le sélecteur du cockpit (Paramètres › Voix & réveil). On NE
  # précharge PAS ${WAKEWORD_MODEL} : s'il pointe un modèle absent (ex. « luna » sans
  # .tflite), le conteneur planterait au démarrage. Le mot choisi est chargé à la
  # demande s'il existe. Pour un mot perso : déposer son .tflite dans
  # config/wakewords/ (monté en /custom), il devient sélectionnable dans le cockpit.
  sentinel-openwakeword:
    image: rhasspy/wyoming-openwakeword
    container_name: sentinel-openwakeword
    restart: unless-stopped
    command: >
      --preload-model hey_jarvis
      --preload-model ok_nabu
      --preload-model alexa
      --custom-model-dir /custom
    volumes:
      - ./config/wakewords:/custom
    # aucun port publié : joignable uniquement par sentinel-core en interne

  # Voix clonée de Luna (OPTIONNEL — profil « voix », désactivé par défaut) :
  # serveur TTS local à API compatible OpenAI (openedai-speech / XTTS). CPU par
  # défaut (latence de quelques secondes) ; pour un GPU, voir docs/VOICE.md.
  # Activation : déposer l'échantillon dans config/voix/voices/, le mapping dans
  # config/voix/config/, mettre TTS_ENGINE=cloned dans .env, puis :
  #   docker compose --profile voix up -d
  # sentinel-core bascule sur cette voix avec repli Piper automatique.
  # NB : chemins/volumes à valider selon la version d'openedai-speech (docs/VOICE.md).
  sentinel-xtts:
    image: ghcr.io/matatonic/openedai-speech:latest
    container_name: sentinel-xtts
    restart: unless-stopped
    profiles: ["voix"]
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./config/voix/config:/app/config
      - ./config/voix/voices:/app/voices
      - xtts-cache:/app/voices/tts
    # aucun port publié : joignable uniquement par sentinel-core en interne

  # Reconnaissance de locuteur (Phase 2) : empreinte vocale via Resemblyzer (CPU).
  # Sert UNIQUEMENT « audio → vecteur » ; l'identité, les profils et les droits
  # vivent dans sentinel-core. Image construite localement (~1–1,5 Go, PyTorch CPU).
  # aucun port publié : joignable uniquement par sentinel-core en interne.
  sentinel-speaker:
    build:
      context: ./speaker
    container_name: sentinel-speaker
    restart: unless-stopped

volumes:
  whisper-models:
  piper-voices:
  xtts-cache:
