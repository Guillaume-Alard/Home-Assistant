# Sentinel — un seul fichier compose pour tout lancer.
# Les variables ${…} sont lues depuis le fichier .env (copie de .env.example).
name: sentinel

services:
  # Cerveau : API + WebSocket + UI PWA + moteur de conversation
  sentinel-core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: sentinel-core
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_DATA_DIR: /data
      WHISPER_HOST: sentinel-whisper
      WHISPER_PORT: "10300"
      PIPER_HOST: sentinel-piper
      PIPER_PORT: "10200"
      DOCKER_PROXY_URL: http://sentinel-dockerproxy:2375
    ports:
      # Seul service exposé sur le LAN
      - "${SENTINEL_PORT:-8443}:8443"
    volumes:
      - ./data:/data
      # Protocoles, alertes et alias d'intents éditables sans reconstruire
      # l'image : modifier puis `docker compose restart sentinel-core`
      - ./config:/opt/sentinel/config:ro
    depends_on:
      - sentinel-whisper
      - sentinel-piper
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # STT : faster-whisper via le protocole Wyoming (image officielle de l'écosystème HA).
  # Le modèle est téléchargé au premier démarrage puis mis en cache dans le volume.
  sentinel-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: sentinel-whisper
    restart: unless-stopped
    command: --model ${WHISPER_MODEL:-small-int8} --language fr
    volumes:
      - whisper-models:/data
    # GPU NVIDIA (optionnel) : cette image est CPU. Pour un GPU, remplacer par une
    # image faster-whisper CUDA compatible Wyoming (ex. linuxserver/faster-whisper
    # avec le tag gpu), ajouter la réservation de device nvidia, et passer
    # WHISPER_MODEL=medium dans .env — même port Wyoming, rien d'autre ne change.

  # TTS : Piper via Wyoming. La voix est téléchargée au premier démarrage.
  sentinel-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: sentinel-piper
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-fr_FR-siwis-medium}
    volumes:
      - piper-voices:/data

  # Accès Docker en LECTURE pour la surveillance (Phase 3A). Le socket n'est
  # jamais monté dans sentinel-core. Seule écriture autorisée : redémarrer/
  # arrêter/démarrer un conteneur (ALLOW_RESTARTS) — et côté Sentinel, un
  # redémarrage n'arrive que par une proposition que tu approuves. Pas d'exec,
  # pas de création, pas de suppression.
  sentinel-dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: sentinel-dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      PING: 1
      VERSION: 1
      ALLOW_RESTARTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # aucun port publié : accessible uniquement depuis le réseau interne compose

volumes:
  whisper-models:
  piper-voices:
