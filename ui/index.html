<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f16">
  <title>Sentinel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-state="offline">

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">SENTINEL</span>
    </div>
    <div class="top-right">
      <button id="proposals-btn" class="chip" type="button" hidden
              aria-label="Propositions en attente">
        ▤ <span id="prop-count">0</span>
      </button>
      <div class="conn" id="conn-nova" title="Nova (Home Assistant)" hidden>
        <span class="conn-dot nova" id="nova-dot" aria-hidden="true"></span>
        <span>nova</span>
      </div>
      <div class="conn" id="conn">
        <span class="conn-dot" id="conn-dot" aria-hidden="true"></span>
        <span id="conn-label">connexion…</span>
      </div>
    </div>
  </header>

  <div id="alert-banner" class="alert-banner" role="alert" hidden>
    <span id="alert-text"></span>
    <button id="alert-close" type="button" aria-label="Fermer l'alerte">✕</button>
  </div>

  <aside id="proposals-panel" class="panel" hidden aria-label="Centre de propositions">
    <header class="panel-head">
      <h2>Propositions</h2>
      <button id="panel-close" type="button" aria-label="Fermer">✕</button>
    </header>
    <div id="proposals-list" class="panel-list"></div>
    <p class="panel-hint">
      À la voix : « approuve / refuse / reporte la proposition N ».
      Les propositions <em>sensibles</em> ne s'approuvent qu'ici.
    </p>
  </aside>

  <main class="layout">
    <section class="stage" aria-label="Commande vocale">
      <div class="orb">
        <canvas id="viz" aria-hidden="true"></canvas>
        <button id="mic" class="mic" type="button"
                aria-label="Parler à Sentinel (barre espace)">
          <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="18" x2="12" y2="21"></line>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2"></rect>
          </svg>
        </button>
      </div>
      <div class="state-label" id="state-label" role="status">hors ligne</div>
    </section>

    <section class="thread" id="thread" aria-label="Conversation" aria-live="polite"></section>
  </main>

  <footer class="composer-bar">
    <form id="composer" class="composer" autocomplete="off">
      <input id="text-input" type="text" placeholder="Écris à Sentinel…"
             aria-label="Message écrit" maxlength="4000">
      <button type="submit" class="send" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13"></path>
          <path d="M22 2 15 22l-4-9-9-4z"></path>
        </svg>
      </button>
    </form>
    <div class="hint">Espace : parler · Échap : interrompre</div>
  </footer>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
