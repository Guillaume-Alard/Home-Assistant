<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noyau synaptique</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* L'hôte de l'orbe prend tout le cadre ; l'orbe suit sa taille (ResizeObserver).
     Ni border-radius ni overflow:hidden — le halo se fond de lui-même au bord. */
  #hote { position: absolute; inset: 0; }
  #hote canvas { display: block; width: 100%; height: 100%; }
</style>
<!-- three.js est EMBARQUÉ (ui/vendor) : aucune dépendance à un CDN, l'orbe vit
     hors ligne sur une tablette murale. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <div id="hote"></div>
  <script type="module">
    // Orbe « Loggia » (moteur WebGL de particules, v3.8.3) piloté par le cockpit
    // via postMessage — le MÊME protocole que l'ancienne orbe, donc app.js est
    // inchangé. Sans WebGL, on échoue en silence : le cockpit continue sans décor.
    import { creerOrbe } from './vendor/orbe.js';

    let orbe = null;
    try {
      orbe = creerOrbe(document.getElementById('hote'));
    } catch (e) {
      console.warn('Orbe indisponible (WebGL absent ?) — cockpit sans décor.', e);
    }

    // Adapte le protocole du cockpit (app.js) à l'API de l'orbe :
    //   { orb:true, state } → setState + teinte (cyan quand elle parle)
    //   { orb:true, level } → setLevel (0..1) / releaseLevel (null)
    //   { orb:true, pulse } → pulse (une onde)
    window.addEventListener('message', (e) => {
      const m = e.data;
      if (!m || m.orb !== true || !orbe) return;
      try {
        if (typeof m.state === 'string') {
          orbe.setState(m.state);                                 // idle|listening|thinking|speaking
          orbe.setTeinte(m.state === 'speaking' ? 'parle' : 'base');
        }
        if ('level' in m) {
          if (m.level == null) orbe.releaseLevel();
          else orbe.setLevel(m.level);
        }
        if (m.pulse) orbe.pulse();
      } catch { /* orbe pas prête / déjà libérée */ }
    });
  </script>
</body>
</html>
